name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      proxy_mode:
        description: "代理模式（off=仅RDP / exit-node=出口代理）"
        required: false
        default: "off"
        type: choice
        options:
          - off
          - exit-node

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355

    steps:
      # ============================================================
      # 1. 开启远程桌面 + 防火墙
      # ============================================================
      - name: 1. Enable RDP & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Write-Host "✅ RDP + Firewall 已就绪"

      # ============================================================
      # 2. 生成纯 ASCII 随机密码 + 创建管理员账户
      # ============================================================
      - name: 2. Generate Random Password & Create Admin
        id: gen_pwd
        run: |
          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'
          $bytes = New-Object byte[] 20
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $rand = -join ($bytes | ForEach-Object { $chars[$_ % $chars.Length] })

          $password = 'Nvd9' + $rand + 'Zx7'

          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Yellow
          Write-Host "  RDP PASSWORD (本次运行生成，仅此一次)" -ForegroundColor Yellow
          Write-Host "  $password" -ForegroundColor Green
          Write-Host "  (纯字母数字，无符号，可放心复制)" -ForegroundColor DarkGray
          Write-Host "==============================================" -ForegroundColor Yellow
          Write-Host ""

          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

          $sec = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "NvdAdmin" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "NvdAdmin" -Password $sec -PasswordNeverExpires
            Write-Host "✅ NvdAdmin 已创建"
          } else {
            Set-LocalUser -Name "NvdAdmin" -Password $sec
            Write-Host "ℹ️ NvdAdmin 已存在，密码已重置为本次随机值"
          }
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          Write-Host "✅ NvdAdmin 已加入 Administrators 组"

      # ============================================================
      # 3. 注册 NvdAdmin 首次登录时的中文化脚本（RunOnce）
      # ============================================================
      - name: 3. Register First-Login Chinese Setup (RunOnce)
        run: |
          $script = @'
          $ErrorActionPreference = 'Continue'

          Set-Culture zh-CN -ErrorAction SilentlyContinue
          Set-WinUILanguageOverride zh-CN -ErrorAction SilentlyContinue

          $intl = "HKCU:\Control Panel\International"
          Set-ItemProperty -Path $intl -Name "sShortDate"  -Value "yyyy/M/d"
          Set-ItemProperty -Path $intl -Name "sLongDate"   -Value "yyyy'年'M'月'd'日'"
          Set-ItemProperty -Path $intl -Name "sShortTime"  -Value "H:mm"
          Set-ItemProperty -Path $intl -Name "sTimeFormat" -Value "H:mm:ss"

          try { Install-Language zh-CN -ErrorAction Stop } catch {}

          Remove-Item "$env:ProgramData\rdp-first-login.ps1" -Force -ErrorAction SilentlyContinue
          '@

          Set-Content -Path "C:\ProgramData\rdp-first-login.ps1" -Value $script -Encoding UTF8
          Write-Host "✅ 首次登录脚本已写入"

          $cmd = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ProgramData\rdp-first-login.ps1"'
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce" `
                           -Name "!RdpChineseSetup" -Value $cmd -Type String
          Write-Host "✅ RunOnce 已注册"

      # ============================================================
      # 4. 安装并启动 ngrok（暴露 RDP 3389 和 Xray 8443）
      # ============================================================
      - name: 4. Install & Start ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $ngrokDir = "C:\ngrok"
          New-Item -ItemType Directory -Path $ngrokDir -Force | Out-Null

          Write-Host "下载 ngrok..."
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "$ngrokDir\ngrok.zip" -UseBasicParsing
          Expand-Archive -Path "$ngrokDir\ngrok.zip" -DestinationPath $ngrokDir -Force

          Write-Host "配置 authtoken..."
          & "$ngrokDir\ngrok.exe" config add-authtoken $env:NGROK_AUTHTOKEN | Out-Null

          $configYml = @"
version: "2"
tunnels:
  rdp:
    proto: tcp
    addr: 3389
  xray:
    proto: tcp
    addr: 8443
"@
          Set-Content -Path "$ngrokDir\ngrok.yml" -Value $configYml -Encoding UTF8

          Write-Host "启动 ngrok 隧道..."
          Start-Process -FilePath "$ngrokDir\ngrok.exe" `
            -ArgumentList "start --all --config $ngrokDir\ngrok.yml" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 12

          Write-Host "获取隧道信息..."
          $tunnels = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $rdpUrl  = ($tunnels.tunnels | Where-Object { $_.name -eq "rdp" }).public_url
          $xrayUrl = ($tunnels.tunnels | Where-Object { $_.name -eq "xray" }).public_url

          if (-not $rdpUrl)  { Write-Error "未获取到 RDP 隧道"; exit 1 }
          if (-not $xrayUrl) { Write-Error "未获取到 Xray 隧道"; exit 1 }

          $rdpHost = ($rdpUrl -replace 'tcp://', '') -split ':'
          $xrayHost = ($xrayUrl -replace 'tcp://', '') -split ':'

          "RDP_HOST=$($rdpHost[0])"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "RDP_PORT=$($rdpHost[1])"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "XRAY_HOST=$($xrayHost[0])"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "XRAY_PORT=$($xrayHost[1])"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

          Write-Host "✅ ngrok 隧道已启动"
          Write-Host "  RDP 公网地址 : $rdpUrl"
          Write-Host "  Xray 公网地址: $xrayUrl"

      # ============================================================
      # 5. 安装并配置 Xray 自建节点（仅监听 127.0.0.1）
      # ============================================================
      - name: 5. Install & Configure Xray Node
        run: |
          $port = 8443
          $uuid = [guid]::NewGuid().ToString()
          $xrayDir = "C:\xray"
          New-Item -ItemType Directory -Path $xrayDir -Force | Out-Null

          Write-Host "下载 Xray..."
          $url = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$xrayDir\xray.zip" -UseBasicParsing
          Expand-Archive -Path "$xrayDir\xray.zip" -DestinationPath $xrayDir -Force

          $config = @{
            inbounds = @(
              @{
                port = $port
                listen = "127.0.0.1"
                protocol = "vless"
                settings = @{
                  clients = @(
                    @{
                      id = $uuid
                      flow = ""
                    }
                  )
                  decryption = "none"
                }
                streamSettings = @{
                  network = "tcp"
                  security = "none"
                }
              }
            )
            outbounds = @(
              @{
                protocol = "freedom"
                settings = @{}
              }
            )
          } | ConvertTo-Json -Depth 10

          Set-Content -Path "$xrayDir\config.json" -Value $config -Encoding UTF8

          Start-Process -FilePath "$xrayDir\xray.exe" `
            -ArgumentList @("run", "-c", "$xrayDir\config.json") `
            -WindowStyle Hidden

          Start-Sleep -Seconds 3

          $vlessLink = "vless://$uuid@$env:XRAY_HOST:$env:XRAY_PORT?encryption=none&security=none&type=tcp#Windows-RDP-Node"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  Xray 自建节点已启动（通过 ngrok 暴露）"
          Write-Host "  协议     : VLESS + TCP"
          Write-Host "  地址     : $env:XRAY_HOST"
          Write-Host "  端口     : $env:XRAY_PORT"
          Write-Host "  UUID     : $uuid"
          Write-Host "  分享链接 : $vlessLink" -ForegroundColor Green
          Write-Host "=========================================="
          Write-Host ""

          "XRAY_VLESS_LINK=$vlessLink" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      # ============================================================
      # 6. 自检 + 打印连接信息
      # ============================================================
      - name: 6. Self-Check
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  RDP SERVER IS READY (公网直连)"
          Write-Host "  RDP 地址     : $env:RDP_HOST"
          Write-Host "  RDP 端口     : $env:RDP_PORT"
          Write-Host "  用户名       : .\NvdAdmin"
          Write-Host "  密码         : $env:RDP_PASSWORD" -ForegroundColor Green
          Write-Host "  代理模式     : ${{ github.event.inputs.proxy_mode }}"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "===== Xray 自建节点 ====="
          if ($env:XRAY_VLESS_LINK) {
            Write-Host $env:XRAY_VLESS_LINK -ForegroundColor Green
          } else {
            Write-Host "⚠️ Xray 节点未配置或未成功启动"
          }

          Write-Host ""
          Write-Host "===== 公网 IP ====="
          try {
            $pub = Invoke-RestMethod -Uri "https://ifconfig.me/ip" -TimeoutSec 20
            Write-Host "Public IP : $pub"
          } catch {
            Write-Host "⚠️ 出口 IP 查询失败：$($_.Exception.Message)"
          }

      # ============================================================
      # 7. 清理
      # ============================================================
      - name: 7. Cleanup
        run: |
          Remove-Item "C:\ngrok\ngrok.zip" -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\xray\xray.zip" -Force -ErrorAction SilentlyContinue
          Write-Host "✅ 清理完成"

      # ============================================================
      # 8. 保活 5 小时
      # ============================================================
      - name: 8. Keep Alive (5 hours)
        run: |
          $end = (Get-Date).AddMinutes(300)
          Write-Host "⏰ 保活至 $end"

          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            $rem = [int]($end - (Get-Date)).TotalMinutes
            Write-Host "alive @ $((Get-Date).ToString('HH:mm:ss')) | 剩余 $rem min"
          }

          Write-Host "=========================================="
          Write-Host "  ⚠️ RDP 会话即将断开 — 请保存工作！"
          Write-Host "=========================================="
