name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355

    steps:
      - name: 1. Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

      - name: 2. Create Admin
        run: |
          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'
          $bytes = New-Object byte[] 20
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $rand = -join ($bytes | ForEach-Object { $chars[$_ % $chars.Length] })
          $password = 'Nvd9' + $rand + 'Zx7'
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          $sec = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "NvdAdmin" -Password $sec -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin"
          Write-Host "PASSWORD: $password"

      - name: 3. Install ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          New-Item -ItemType Directory -Path "C:\ngrok" -Force | Out-Null
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "C:\ngrok\ngrok.zip" -UseBasicParsing
          Expand-Archive -Path "C:\ngrok\ngrok.zip" -DestinationPath "C:\ngrok" -Force
          & "C:\ngrok\ngrok.exe" config add-authtoken $env:NGROK_AUTHTOKEN
          Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep -Seconds 12
          $tunnels = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $url = $tunnels.tunnels[0].public_url
          Write-Host "RDP URL: $url"

      - name: 4. Keep Alive
        run: |
          $end = (Get-Date).AddMinutes(300)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            Write-Host "alive $(Get-Date -Format HH:mm:ss)"
          }
