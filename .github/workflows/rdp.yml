name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      proxy_mode:
        description: "代理模式（off=仅RDP / exit-node=出口代理）"
        required: false
        default: "off"
        type: choice
        options:
          - off
          - exit-node

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355

    steps:
      # ============================================================
      # 1. 开启远程桌面 + 防火墙
      # ============================================================
      - name: 1. Enable RDP & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Write-Host "✅ RDP + Firewall 已就绪"

      # ============================================================
      # 2. 生成随机密码 + 创建管理员账户
      # ============================================================
      - name: 2. Generate Random Password & Create Admin
        id: gen_pwd
        run: |
          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'
          $bytes = New-Object byte[] 20
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $rand = -join ($bytes | ForEach-Object { $chars[$_ % $chars.Length] })

          $password = 'Nvd9' + $rand + 'Zx7'

          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Yellow
          Write-Host "  RDP PASSWORD (本次运行生成，仅此一次)" -ForegroundColor Yellow
          Write-Host "  $password" -ForegroundColor Green
          Write-Host "  (纯字母数字，无符号，可放心复制)" -ForegroundColor DarkGray
          Write-Host "==============================================" -ForegroundColor Yellow
          Write-Host ""

          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

          $sec = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "NvdAdmin" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "NvdAdmin" -Password $sec -PasswordNeverExpires
            Write-Host "✅ NvdAdmin 已创建"
          } else {
            Set-LocalUser -Name "NvdAdmin" -Password $sec
            Write-Host "ℹ️ NvdAdmin 已存在，密码已重置为本次随机值"
          }
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          Write-Host "✅ NvdAdmin 已加入 Administrators 组"

      # ============================================================
      # 3. 首次登录中文化（RunOnce）
      # ============================================================
      - name: 3. Register First-Login Chinese Setup (RunOnce)
        run: |
          $script = @'
          $ErrorActionPreference = 'Continue'

          Set-Culture zh-CN -ErrorAction SilentlyContinue
          Set-WinUILanguageOverride zh-CN -ErrorAction SilentlyContinue

          $intl = "HKCU:\Control Panel\International"
          Set-ItemProperty -Path $intl -Name "sShortDate"  -Value "yyyy/M/d"
          Set-ItemProperty -Path $intl -Name "sLongDate"   -Value "yyyy'年'M'月'd'日'"
          Set-ItemProperty -Path $intl -Name "sShortTime"  -Value "H:mm"
          Set-ItemProperty -Path $intl -Name "sTimeFormat" -Value "H:mm:ss"

          try { Install-Language zh-CN -ErrorAction Stop } catch {}

          Remove-Item "$env:ProgramData\rdp-first-login.ps1" -Force -ErrorAction SilentlyContinue
          '@

          Set-Content -Path "C:\ProgramData\rdp-first-login.ps1" -Value $script -Encoding UTF8
          Write-Host "✅ 首次登录脚本已写入"

          $cmd = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ProgramData\rdp-first-login.ps1"'
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce" `
                           -Name "!RdpChineseSetup" -Value $cmd -Type String
          Write-Host "✅ RunOnce 已注册"

      # ============================================================
      # 4. 安装并连接 Tailscale
      # ============================================================
      - name: 4. Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $proxyMode = "${{ github.event.inputs.proxy_mode }}"

          if ($proxyMode -eq "exit-node") {
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "IPEnableRouter" -Value 1
          }

          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5

          $tsExe  = "C:\Program Files\Tailscale\tailscale.exe"
          $tsArgs = @("up", "--authkey=$Env:TAILSCALE_AUTHKEY", "--hostname=github-rdp-$env:GITHUB_RUN_ID")

          if ($proxyMode -eq "exit-node") {
            $tsArgs += "--advertise-exit-node"
            $tsArgs += "--accept-routes"
          }

          & $tsExe @tsArgs *>&1 | Out-Null
          Start-Sleep -Seconds 8
          Write-Host "✅ Tailscale 已连接"

      # ============================================================
      # 5. 安装并配置 Xray 节点（仅监听 Tailscale IP）
      # ============================================================
      - name: 5. Install & Configure Xray Node
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          $tsIp = (& $tsExe ip -4 | Select-Object -First 1).Trim()
          if (-not $tsIp) { Write-Error "未获取到 Tailscale IP"; exit 1 }

          $port = 8443
          $uuid = [guid]::NewGuid().ToString()
          $xrayDir = "C:\xray"
          New-Item -ItemType Directory -Path $xrayDir -Force | Out-Null

          Write-Host "下载 Xray..."
          $url = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$xrayDir\xray.zip" -UseBasicParsing
          Expand-Archive -Path "$xrayDir\xray.zip" -DestinationPath $xrayDir -Force

          $config = @{
            inbounds = @(
              @{
                port = $port
                listen = $tsIp
                protocol = "vless"
                settings = @{
                  clients = @(
                    @{
                      id = $uuid
                      flow = ""
                    }
                  )
                  decryption = "none"
                }
                streamSettings = @{
                  network = "tcp"
                  security = "none"
                }
              }
            )
            outbounds = @(
              @{
                protocol = "freedom"
                settings = @{}
              }
            )
          } | ConvertTo-Json -Depth 10

          Set-Content -Path "$xrayDir\config.json" -Value $config -Encoding UTF8

          New-NetFirewallRule -DisplayName "Xray Node (Tailscale)" `
            -Direction Inbound -Protocol TCP -LocalPort $port `
            -RemoteAddress 100.64.0.0/10 -Action Allow -ErrorAction SilentlyContinue | Out-Null

          Start-Process -FilePath "$xrayDir\xray.exe" `
            -ArgumentList @("run", "-c", "$xrayDir\config.json") `
            -WindowStyle Hidden

          Start-Sleep -Seconds 3

          $vlessLink = "vless://$uuid@${tsIp}:${port}?encryption=none&security=none&type=tcp#Windows-RDP-Node"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  Xray 自建节点已启动"
          Write-Host "  协议     : VLESS + TCP"
          Write-Host "  地址     : $tsIp"
          Write-Host "  端口     : $port"
          Write-Host "  UUID     : $uuid"
          Write-Host "  分享链接 : $vlessLink" -ForegroundColor Green
          Write-Host "=========================================="
          Write-Host ""

          "XRAY_VLESS_LINK=$vlessLink" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "TAILSCALE_IP=$tsIp"         | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      # ============================================================
      # 6. 自检 + 打印连接信息
      # ============================================================
      - name: 6. Self-Check
        run: |
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "===== tailscale status ====="
          & $tsExe status

          Write-Host ""
          Write-Host "===== Tailscale IPv4 ====="
          $tsIp = & $tsExe ip -4
          Write-Host $tsIp

          Write-Host ""
          Write-Host "===== Public IP ====="
          try {
            $pub = Invoke-RestMethod -Uri "https://ifconfig.me/ip" -TimeoutSec 20
            Write-Host "Public IP : $pub"
          } catch {
            Write-Host "⚠️ 出口 IP 查询失败：$($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  RDP SERVER IS READY"
          Write-Host "  Tailscale IP : $tsIp"
          Write-Host "  Username     : .\NvdAdmin"
          Write-Host "  Password     : $env:RDP_PASSWORD" -ForegroundColor Green
          Write-Host "  Proxy Mode   : ${{ github.event.inputs.proxy_mode }}"
          if ("${{ github.event.inputs.proxy_mode }}" -eq "exit-node") {
            Write-Host "  >> 需在 Tailscale 后台勾选 Exit Node:"
            Write-Host "     https://login.tailscale.com/admin/machines"
          }
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "===== Xray 自建节点 ====="
          if ($env:XRAY_VLESS_LINK) {
            Write-Host $env:XRAY_VLESS_LINK -ForegroundColor Green
          } else {
            Write-Host "⚠️ Xray 节点未配置或未成功启动"
          }

      # ============================================================
      # 7. 清理
      # ============================================================
      - name: 7. Cleanup
        run: |
          Remove-Item "C:\tailscale.msi" -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\xray\xray.zip" -Force -ErrorAction SilentlyContinue
          Write-Host "✅ 清理完成"

      # ============================================================
      # 8. 保活 5 小时
      # ============================================================
      - name: 8. Keep Alive (5 hours)
        run: |
          $end = (Get-Date).AddMinutes(300)
          Write-Host "⏰ 保活至 $end"

          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            $rem = [int]($end - (Get-Date)).TotalMinutes
            Write-Host "alive @ $((Get-Date).ToString('HH:mm:ss')) | 剩余 $rem min"
          }

          Write-Host "=========================================="
          Write-Host "  ⚠️ RDP 会话即将断开 — 请保存工作！"
          Write-Host "=========================================="
